# Hay UN REGISTRO POR AMBIENTE, en el grupo de recursos de carga, y la clave de
# su estado lleva el ambiente. El estado vive en el grupo de identidades, donde
# la identidad de despliegue solo tiene acceso a los blobs: el backend entra por
# Entra ID y no necesita el grupo de recursos de la cuenta.
- name: login azure
  description: espera el token de la CLI e inicia sesion en az
  cmd: vex-azure-login

- name: terraform init
  description: configura el estado remoto del ambiente y usa los providers incluidos en la imagen
  workdir: terraform
  cmd: >-
    terraform init -input=false
    -backend-config="storage_account_name=$VEX_AZURE_STATE_ACCOUNT"
    -backend-config="container_name=$VEX_AZURE_STATE_CONTAINER"
    -backend-config="key=${var.project_id}/${var.environment}/acr.tfstate"
    -backend-config="use_azuread_auth=true"

- name: terraform plan
  description: calcula los cambios del registro de contenedores
  workdir: terraform
  cmd: >-
    terraform plan -input=false -out=plan.out
    -var "azure_resource_group_name=$VEX_AZURE_RESOURCE_GROUP"

- name: terraform apply
  description: crea o actualiza el registro de contenedores
  workdir: terraform
  cmd: terraform apply -input=false -auto-approve plan.out
  outputs:
    - name: azure_container_registry_name
      description: nombre del registro de contenedores
      probe: 'azure_container_registry_name\s*=\s*"([^"]+)"'
    - name: azure_container_registry_login_server
      description: dominio del registro de contenedores
      probe: 'azure_container_registry_login_server\s*=\s*"([^"]+)"'
