- name: login azure
  description: espera el token de la CLI e inicia sesion en az
  cmd: vex-azure-login

- name: build en ACR
  description: construye la imagen en Azure con la etiqueta de la version; solo se sube el codigo fuente
  cmd: >-
    az acr build --registry "${var.azure_container_registry_name}"
    --image "${var.project_name}:${var.project_version}"
    --file "${var.step_workdir}/docker/Dockerfile" "${var.project_workdir}"

# La etiqueta es mutable: quien pueda escribir en el registro puede moverla. El
# digest identifica el contenido, y es lo unico que usa el paso deploy.
- name: digest de la imagen
  description: lee el digest de la imagen recien construida
  cmd: >-
    az acr repository show --name "${var.azure_container_registry_name}"
    --image "${var.project_name}:${var.project_version}"
    --query "join('=', ['image_digest', digest])" --output tsv
  outputs:
    - name: image_digest
      description: digest (sha256) de la imagen que se despliega
      probe: 'image_digest=(sha256:[0-9a-f]{64})'
