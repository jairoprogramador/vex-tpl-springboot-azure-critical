- name: login azure
  description: espera el token de la CLI e inicia sesion en az
  cmd: vex-azure-login

- name: credenciales de AKS
  description: descarga el kubeconfig del cluster
  cmd: az aks get-credentials --resource-group "$VEX_AZURE_RESOURCE_GROUP" --name "${var.azure_kubernetes_cluster_name}" --overwrite-existing

- name: kubelogin
  description: hace que kubectl entre al cluster con la sesion de az (sin cuentas locales)
  cmd: kubelogin convert-kubeconfig -l azurecli

- name: namespace
  description: crea el namespace si no existe
  cmd: kubectl create namespace "${var.k8s_namespace}" --dry-run=client -o yaml | kubectl apply -f -

- name: aplicar manifiestos
  description: aplica los manifiestos de Kubernetes en el cluster
  workdir: k8s
  cmd: kubectl apply -f .
  templates:
    - deployment.yaml
    - ingress.yaml
    - resourcequota.yaml
    - service.yaml

- name: esperar despliegue
  description: espera hasta 5 minutos a que el despliegue termine
  cmd: kubectl rollout status "deployment/${var.k8s_project_instance}" --namespace "${var.k8s_namespace}" --timeout=300s

- name: pods
  description: enseña el estado de los pods de la aplicacion
  cmd: kubectl get pods --namespace "${var.k8s_namespace}" -l "app.kubernetes.io/name=${var.project_name},environment=${var.environment}"

- name: servicios
  description: enseña los servicios de la aplicacion
  cmd: kubectl get services --namespace "${var.k8s_namespace}" -l "app.kubernetes.io/name=${var.project_name},environment=${var.environment}"
