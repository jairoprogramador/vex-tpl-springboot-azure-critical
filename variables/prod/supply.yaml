# Lo que este step CONSUME y no define: los tres nombres del registro de
# contenedores, que produce `02-acr` en el ámbito de PROYECTO mientras este step
# corre en el de AMBIENTE. Los tres cruzan ese borde vía `terraform.tfvars`, que
# es plantilla declarada, así que los interpola el motor antes del `plan`.
#
# Antes llegaban por nombre desde el mapa acumulado y nadie decía de dónde salían.
# Ahora el grafo está escrito y se valida EN LA CARGA: que `02-acr` se ejecute
# antes, y que declare estos `outputs`.
- name: "azure_container_registry_rg"
  description: "resource group of the Azure Container Registry, produced by 02-acr"
  resolve: step-output
  from: "02-acr"
  key: "azure_container_registry_rg"

- name: "azure_container_registry_name"
  description: "name of the Azure Container Registry, produced by 02-acr"
  resolve: step-output
  from: "02-acr"
  key: "azure_container_registry_name"

- name: "azure_container_registry_login_server"
  description: "login server of the Azure Container Registry, produced by 02-acr"
  resolve: step-output
  from: "02-acr"
  key: "azure_container_registry_login_server"

- name: "azure_kubernetes_cluster_vm_size"
  description: "size of the virtual machines for the nodes of the AKS cluster"
  value: "standard_a4_v2"

- name: "azure_kubernetes_cluster_node_count"
  description: "Define the initial number of nodes in the default pool of the AKS cluster"
  value: 2