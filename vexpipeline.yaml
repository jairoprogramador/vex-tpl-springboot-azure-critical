# El contrato de FORMATO de este pipelinecode (spec 14 §5.1).
#
# La versión 2 es la que admite `resolve:` en `variables/<ambiente>/<paso>.yaml`,
# que es como el consumidor declara de dónde sale una variable que no escribe él.
# Sin este archivo el pipelinecode sería versión 1: todo `resolve` se rechazaría
# al cargar y el objeto de despliegue saldría marcado como incompleto (18 §5.5).
#
# NO es el `schema_version` del `RequestInput` entre la CLI y el motor. Son dos
# contratos con dos ciclos de vida: éste lo escribe quien mantiene la plantilla.
# Que hoy valgan lo mismo es coincidencia.
schema_version: 2
